description: >-
  Sears Hometown and Outlet Stores, Inc. (NASDAQ: SHOS) was a national retailer of home
  appliances, lawn and garden equipment, tools and hardware, spun off from Sears Holdings
  in October 2012 and operating two segments: Sears Hometown and Hardware, a largely
  franchised network of smaller-format stores in rural and suburban markets, and Sears
  Outlet, which sold new, one-of-a-kind, out-of-carton, discontinued, obsolete, used,
  reconditioned, overstocked and scratch-and-dent merchandise. The company was acquired
  by Transform Holdco (Transformco) and ESL Investments in October 2019, at which point
  the Sears Outlet business was sold on to Franchise Group and rebranded American Freight.
  Sears Hometown filed for Chapter 11 in December 2022 and converted to a Chapter 7
  liquidation in February 2023. The company is defunct: it never operated a public
  developer program, and its corporate domain shos.com is now a parked registrar page
  serving a wildcard *.hostgator.com certificate and a 404, so there is no API surface,
  documentation, or /.well-known/ document left to profile.
